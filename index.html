<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>픽셀 VTuber — 퇴근여우</title><link rel="icon" href="data:,"><link rel="stylesheet" href="style.css?v=20261021-fox65o"></head><body>
<div id="stage"><canvas id="c" width="96" height="96"></canvas></div>
<div id="hud"><span id="fps">FPS: -</span> <span id="status">대기 중</span> <span id="pose"></span><div id="meter" hidden>신남 <span class="track"><span id="meterBar"></span></span></div></div>
<video id="video" playsinline muted autoplay></video>
<div id="panel">
 <h1>픽셀 VTuber</h1>
 <label>캐릭터 <select id="char"><option value="fox65" selected>퇴근여우 v6.5</option><option value="fox64">퇴근여우 v6.4</option><option value="fox63">퇴근여우 v6.3</option><option value="fox62">퇴근여우 v6.2</option><option value="fox61">퇴근여우 v6.1</option><option value="fox6">퇴근여우 v6</option><option value="fox53">퇴근여우 v5.3</option><option value="fox52">퇴근여우 v5.2</option><option value="fox51">퇴근여우 v5.1</option><option value="fox5">퇴근여우 v5</option><option value="fox4">퇴근여우 v4</option><option value="fox3">퇴근여우 v3 (128px 레이어)</option><option value="fox2">퇴근여우 v2 (96px)</option><option value="test">테스트 캐릭터 (구버전)</option></select></label>
 <button id="start">▶ 카메라 시작</button>
 <button id="demo">데모 모드</button>
 <button id="micBtn">🎤 마이크 켜기</button>
 <div id="err" hidden></div>
 <div id="expr" class="row"><button data-e="auto" class="on">자동</button><button data-e="happy">웃음</button><button data-e="tired">피곤</button><button data-e="surprised">놀람</button><button data-e="smug">의기양양</button></div>
 <label>신남 감도 <input type="range" id="micSens" min="0.5" max="2" step="0.05" value="1"><output></output></label>
 <label><input type="checkbox" id="micExpr" checked> 신나면 표정 자동 변경 (웃음+반짝)</label>
 <label><input type="checkbox" id="choppy" checked> 끊김 느낌 (각도 단계 전환)</label>
 <label>애니메이션 fps <input type="range" id="animFps" min="6" max="30" step="1" value="12"><output></output></label>
 <label><input type="checkbox" id="mirror" checked> 거울 모드 (셀카처럼 좌우 반전)</label>
 <label><input type="checkbox" id="preview"> 카메라 미리보기</label>
 <label>입 벌림 기준 <input type="range" id="tMouth" min="0.05" max="0.6" step="0.01" value="0.18"><output></output></label>
 <label>눈 깜빡임 기준 <input type="range" id="tBlink" min="0.2" max="0.8" step="0.01" value="0.5"><output></output></label>
 <label>미소 기준 <input type="range" id="tSmile" min="0.1" max="0.8" step="0.01" value="0.4"><output></output></label>
 <label>부드러움 <input type="range" id="smooth" min="0" max="0.95" step="0.01" value="0.5"><output></output></label>
 <label>배경색 <input type="color" id="bg" value="#00ff00"> <button id="green">그린스크린</button></label>
 <button id="clean">클린 뷰 (OBS용)</button>
 <p class="hint">단축키: 1 자동 · 2 웃음 · 3 피곤 · 4 놀람 · 5 의기양양 · h 클린 뷰 · Esc/더블탭 해제</p>
</div>
<script type="module" src="js/app.js?v=20261021-fox65o"></script></body></html>
